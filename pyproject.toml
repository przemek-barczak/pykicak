[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pykicak"
dynamic = ["version"]
description = "A Python library for building RabbitMQ-connected agent nodes with idempotent message processing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Przemysław Barczak" },
]
keywords = [
    "rabbitmq",
    "amqp",
    "pika",
    "message-queue",
    "messaging",
    "idempotent",
    "at-least-once-delivery",
    "dead-letter-queue",
    "distributed-systems",
    "event-driven",
]
# No license classifier: with an SPDX `license` expression, PEP 639 forbids one.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pika>=1.4,<2",
]

[dependency-groups]
# Development tools, not published as package metadata: `pip install -e . --group dev` (pip 25.1+).
# Pinned, so that CI checks with the same tools every time; Dependabot proposes updates weekly.
# trustme issues the test certificates of the TLS tests; cryptography builds nonconforming ones
test = [
    "cryptography==50.0.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "trustme==1.2.1",
]
# What the release workflow needs to build and check the distributions
release = [
    "build==1.6.1",
    "twine==7.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "release" },
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://github.com/przemek-barczak/pykicak"
Repository = "https://github.com/przemek-barczak/pykicak"
Documentation = "https://github.com/przemek-barczak/pykicak/blob/main/docs/README.md"
Issues = "https://github.com/przemek-barczak/pykicak/issues"
Changelog = "https://github.com/przemek-barczak/pykicak/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pykicak.__version__" }

[tool.setuptools.packages.find]
# Only the library is published (wheel and sdist); tests/, examples/, and docs/ stay in the
# repository, and MANIFEST.in prunes them from the sdist.
include = ["pykicak*"]

[tool.setuptools.package-data]
# PEP 561 marker: type checkers use pykicak's annotations only if it is installed.
pykicak = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live RabbitMQ broker (excluded by default)",
]
addopts = "--strict-markers -m 'not integration'"

[tool.coverage.run]
source = ["pykicak"]

[tool.coverage.report]
# Statement coverage of the unit tests, enforced by `pytest --cov` in CI
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# C90 and the PLR rules keep functions small: at most a McCabe complexity of 10, 6 returns,
# 12 branches, and 50 statements
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C90", "PLR0911", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pykicak", "examples", "tests", ".github/scripts"]

[[tool.mypy.overrides]]
# Test bodies are checked, but pytest functions and fixtures need no annotations
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# pika ships no type information, and the types-pika stubs are an outdated beta
module = ["pika", "pika.*"]
ignore_missing_imports = true
