name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group test
      - run: pytest

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check .
      - run: mypy
      - name: Build and check the distributions
        run: |
          python -m build
          twine check --strict dist/*

  integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        env:
          # Must match the .kicak connection file written below
          RABBITMQ_DEFAULT_USER: pykicak
          RABBITMQ_DEFAULT_PASS: pykicak
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group test
      - name: Write the broker connection file
        run: |
          printf '%s\n' \
            RABBIT_MQ_USERNAME=pykicak \
            RABBIT_MQ_PASSWORD=pykicak \
            RABBIT_MQ_HOST=localhost \
            RABBIT_MQ_PORT=5672 \
            RABBIT_MQ_VIRTUAL_HOST=/ > .kicak
      - run: pytest -m integration
